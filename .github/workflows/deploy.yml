# Arma la web (scripts/build.mjs) y la publica en GitHub Pages.
# Corre con cada push, cada hora (para que las páginas de los autos cargados en el panel
# lleguen a Google y a las vistas previas de WhatsApp) y cuando Supabase avisa un cambio (ver README).
name: Publicar

on:
  push:
    branches: [main]
  schedule:
    - cron: '7 * * * *'
  repository_dispatch:
    types: [autos]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/build.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
